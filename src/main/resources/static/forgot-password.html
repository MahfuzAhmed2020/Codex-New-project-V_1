<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Demo Ordering</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="forgot-password">
<main class="page-shell">
    <section class="hero">
        <div>
            <h1>Forgot Password</h1>
            <p>Enter the registered email address and a MailHog reset link will be sent to that inbox.</p>
        </div>
        <div class="button-row">
            <button class="nav-button" type="button" data-nav="back" data-fallback="/login.html">Back</button>
            <button class="nav-button" type="button" data-nav="forward" data-fallback="/reset-password.html">Forward</button>
            <span class="pill">Recovery</span>
        </div>
    </section>

    <section class="panel">
        <form id="forgot-password-form">
            <label>Email<input name="email" type="email" required></label>
            <div class="button-row">
                <button type="submit">Send reset link</button>
                <a class="inline-link" href="/login.html">Return to login</a>
            </div>
        </form>
        <div id="forgot-message" hidden></div>
    </section>
</main>
<script src="/app.js"></script>
</body>
</html>
