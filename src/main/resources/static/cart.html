<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Cart | Demo Ordering</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="cart">
<main class="page-shell">
    <section class="hero">
        <div>
            <h1>Edit Cart</h1>
            <p>Review and edit cart items for <strong id="cart-page-name"></strong> using the plus and minus buttons before checkout.</p>
        </div>
        <div class="button-row">
            <button class="nav-button" type="button" data-nav="back" data-fallback="/menu.html">Back</button>
            <button class="nav-button" type="button" data-nav="forward" data-fallback="/checkout.html">Forward</button>
            <a class="inline-link" href="/menu.html">Return to menu</a>
            <a class="inline-link" href="/checkout.html">Go to checkout</a>
            <button id="cart-logout-button" type="button">Logout</button>
        </div>
    </section>

    <section class="panel">
        <h2>Your Cart</h2>
        <ul id="cart-items" class="cart-list"></ul>
        <p><strong>Total:</strong> $<span id="cart-total">0.00</span></p>
        <div id="cart-message" hidden></div>
        <div class="button-row">
            <a class="inline-link" href="/menu.html">Continue shopping</a>
            <a class="inline-link" href="/checkout.html">Proceed to checkout</a>
        </div>
    </section>
</main>
<script src="/app.js"></script>
</body>
</html>
