<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Demo Ordering</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="login">
<main class="page-shell">
    <section class="hero">
        <div>
            <h1>Login To Order</h1>
            <p>Use the email and password from registration to reach the order menu page.</p>
        </div>
        <div class="button-row">
            <button class="nav-button" type="button" data-nav="back" data-fallback="/index.html">Back</button>
            <button class="nav-button" type="button" data-nav="forward" data-fallback="/menu.html">Forward</button>
            <span class="pill">Login</span>
        </div>
    </section>

    <section class="panel">
        <form id="login-form">
            <label>Email<input name="email" type="email" required></label>
            <label>
                Password
                <div class="input-with-button">
                    <input id="login-password" name="password" type="password" required>
                    <button class="inline-action" type="button" data-password-target="login-password">Show</button>
                </div>
            </label>
            <div class="button-row">
                <button type="submit">Login</button>
                <a class="inline-link" href="/forgot-password.html">Forgot password?</a>
                <a class="inline-link" href="/index.html">Back to registration</a>
            </div>
        </form>
        <div id="login-message" hidden></div>
    </section>
</main>
<script src="/app.js"></script>


<!-- at the bottom of each page FOR WEATHER WIDGET -->
<script src="/weather-widget.js"></script>

</body>
</html>
