<!DOCTYPE html>

    <title>Order Status | Demo Ordering</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="order-status">
<main class="page-shell">

            <h1>Order Status</h1>
            <p>Open this page directly from the MailHog email link to check the current status of your order.</p>
        </div>
        <div class="button-row">
            <button class="nav-button" type="button" data-nav="back" data-fallback="/index.html">Back</button>
