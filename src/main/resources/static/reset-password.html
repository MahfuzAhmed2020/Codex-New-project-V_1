<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Demo Ordering</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="reset-password">
<main class="page-shell">
    <section class="hero">
        <div>
            <h1>Reset Password</h1>
            <p>Open this page from the MailHog reset link and choose a new password.</p>
        </div>
        <div class="button-row">
            <button class="nav-button" type="button" data-nav="back" data-fallback="/forgot-password.html">Back</button>
            <button class="nav-button" type="button" data-nav="forward" data-fallback="/login.html">Forward</button>
            <span class="pill">Reset</span>
        </div>
    </section>

    <section class="panel">
        <form id="reset-password-form">
            <label>
                New password
                <div class="input-with-button">
                    <input id="reset-password" name="password" type="password" required>
                    <button class="inline-action" type="button" data-password-target="reset-password">Show</button>
                </div>
            </label>
            <label>
                Confirm password
                <div class="input-with-button">
                    <input id="reset-confirm-password" name="confirmPassword" type="password" required>
                    <button class="inline-action" type="button" data-password-target="reset-confirm-password">Show</button>
                </div>
            </label>
            <div class="button-row">
                <button type="submit">Reset password</button>
                <a class="inline-link" href="/login.html">Return to login</a>
            </div>
        </form>
        <div id="reset-message" hidden></div>
    </section>
</main>
<script src="/app.js"></script>
</body>
</html>
